# Das Image entsteht mit `mise run docker:build` (Werkzeuge aus mise.toml/mise.lock).
services:
  tischlein:
    image: tischlein:latest
    container_name: tischlein
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env          # optional: PAPRIKA_EMAIL, PAPRIKA_PASSWORD, HA_WEBHOOK_URL (nicht committen)
        required: false
    volumes:
      - ./data:/data        # muss für UID 10001 (Benutzer im Container) beschreibbar sein
      - ./tischlein.toml:/app/tischlein.toml:ro
