<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tischlein{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tischlein.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='3' y='9' width='22' height='3.5' rx='1.75' fill='%231f201d'/%3E%3Crect x='6' y='12' width='3' height='12' rx='1.5' fill='%231f201d'/%3E%3Crect x='19' y='12' width='3' height='12' rx='1.5' fill='%231f201d'/%3E%3Ccircle cx='14' cy='5.5' r='3' fill='%231b6e66'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <header class="side">
    <a class="brand" href="/" aria-label="Tischlein, zur Woche">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="3" y="9" width="22" height="3.5" rx="1.75" fill="#1f201d"/>
        <rect x="6" y="12" width="3" height="12" rx="1.5" fill="#1f201d"/>
        <rect x="19" y="12" width="3" height="12" rx="1.5" fill="#1f201d"/>
        <circle cx="14" cy="5.5" r="3" fill="#1b6e66"/>
      </svg>
      <span class="brand-name">Tischlein<span class="brand-sub">Mittagessen der Familie</span></span>
    </a>
    <nav class="nav" aria-label="Bereiche">
      <a href="/" title="Woche" {% if nav == 'woche' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
        <span>Woche</span>
      </a>
      <a href="/einkauf" title="Einkauf" {% if nav == 'einkauf' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1.5 2h2l1.6 8.2h7.6L14.5 4.5H4.4"/><circle cx="6.2" cy="13.2" r="1"/><circle cx="12" cy="13.2" r="1"/></svg>
        <span>Einkauf</span>
      </a>
      <a href="/rezepte" title="Rezepte" {% if nav == 'rezepte' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 2.5h7.5L13 5v8.5H3z"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3"/></svg>
        <span>Rezepte</span>
      </a>
      <a href="/ideen" title="Ideen" {% if nav == 'ideen' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.8a4.2 4.2 0 0 0-2.5 7.6c.5.4.8 1 .8 1.6v.5h3.4V11c0-.6.3-1.2.8-1.6A4.2 4.2 0 0 0 8 1.8z"/><path d="M6.3 13.5h3.4"/></svg>
        <span>Ideen</span>
      </a>
      <a href="/rueckblick" title="Rückblick" {% if nav == 'rueckblick' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 13.5h12M4 11V7.5M8 11V4M12 11V6"/></svg>
        <span>Rückblick</span>
      </a>
      <a href="/einstellungen" title="Einstellungen" {% if nav == 'einstellungen' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        <span>Einstellungen</span>
      </a>
    </nav>
    <div class="side-bottom">
      {% block sidefoot %}{% endblock %}
      {% if person %}<p class="side-person">Angemeldet als <strong>{{ person }}</strong></p>{% endif %}
      <p class="side-version">Version {{ version }}</p>
    </div>
  </header>
  <main class="sheet">
    <div class="col">
      <div class="sync-banner" id="sync-banner" role="status" aria-live="polite" hidden>
        <div class="sync-line"><strong id="sync-text">Paprika-Abgleich läuft …</strong><span id="sync-count" class="num"></span></div>
        <div class="sync-bar" aria-hidden="true"><span id="sync-fill"></span></div>
      </div>
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
<script src="/static/sync.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
