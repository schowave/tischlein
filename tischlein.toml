# Wochenschema für Tischlein. Themen müssen als Kategorie in Paprika existieren.

[plan]
kinder_tag = "Kinder-OK"     # Kategorie für Rezepte, die die Jungs essen
neu_tag = "Neu"              # Kategorie für Rezepte, die ausprobiert werden sollen
ki_tag = "KI"                # Kategorie für Rezepte, die aus einer KI-Idee stammen
hauptspeise_tag = "Hauptspeisen"  # nur solche Gerichte (oder mit Thema) kommen in den Neu-Slot
portionen = 4                # so viele Portionen plant Tischlein pro Gericht, Rezepte werden umgerechnet
neu_slot = "do"              # Tag für das Neu-Rezept; "" schaltet den Neu-Slot ab
cooldown_wochen = 2          # Rezept frühestens nach so vielen Wochen wieder
mittag_uhrzeit = "12:00"
mittag_minuten = 45
weitere_themen = ["Fleisch"]   # Themen ohne eigenen Tag, erscheinen in der Rezeptverwaltung
feiertage_land = "BW"          # Bundesland für Landesfeiertage, z. B. "BW" oder "BY"; leer = nur bundesweite

[abgleich]
alle_minuten = 15            # so oft fragt Tischlein Paprika nach Änderungen; 0 = nur von Hand

[einkauf]
# Vorräte, die nicht auf die Einkaufsliste kommen
vorrat = ["Salz", "Pfeffer", "Zucker", "Mehl", "Öl", "Olivenöl", "Rapsöl", "Sonnenblumenöl", "Wasser",
          "Essig", "Paprikapulver", "Currypulver", "Gemüsebrühe", "Brühe"]

[erinnerung]
# Meldungen an Home Assistant (HA_WEBHOOK_URL); "" schaltet die jeweilige Meldung ab
uhrzeit = "18:00"            # Vorabend: „Morgen gibt's …“ samt Vorbereitung
bewertung = "13:00"          # nach dem Mittagessen: „Wie war's?“ mit Knöpfen
entwurf = "fr 17:00"         # Entwurf für die nächste Woche anlegen und melden
freigabe = "so 18:00"        # einmal erinnern, wenn die nächste Woche noch nicht freigegeben ist

[[tage]]
tag = "mo"
thema = "Hähnchen"

[[tage]]
tag = "di"
thema = "Hülsenfrüchte"

[[tage]]
tag = "mi"
thema = "Fisch"

[[tage]]
tag = "do"
thema = "Eier/Quark"

[[tage]]
tag = "fr"
thema = "Pasta/Reis"
