# Wochenschema für Tischlein. Themen müssen als Kategorie in Paprika existieren.

[plan]
kinder_tag = "Kinder-OK"     # Kategorie für Rezepte, die die Jungs essen
neu_tag = "Neu"              # Kategorie für Rezepte, die ausprobiert werden sollen
hauptspeise_tag = "Hauptspeisen"  # nur solche Gerichte (oder mit Thema) kommen in den Neu-Slot
neu_slot = "do"              # Tag für das Neu-Rezept; "" schaltet den Neu-Slot ab
cooldown_wochen = 2          # Rezept frühestens nach so vielen Wochen wieder
mittag_uhrzeit = "12:00"
mittag_minuten = 45
weitere_themen = ["Fleisch"]   # Themen ohne eigenen Tag, erscheinen in der Rezeptverwaltung

[abgleich]
alle_minuten = 15            # so oft fragt Tischlein Paprika nach Änderungen; 0 = nur von Hand

[[tage]]
tag = "mo"
thema = "Hähnchen"

[[tage]]
tag = "di"
thema = "Hülsenfrüchte"

[[tage]]
tag = "mi"
thema = "Fisch"

[[tage]]
tag = "do"
thema = "Eier/Quark"

[[tage]]
tag = "fr"
thema = "Pasta/Reis"
