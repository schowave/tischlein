# Werkzeuge und Abläufe für dieses Repo – eine Quelle für lokal, CI und Docker-Build.
min_version = "2026.11.5"  # dieselbe mise-Version nutzen CI und Docker-Build
# Erstmalige Nutzung:  mise trust && mise run setup

[settings]
# mise.lock hält die exakten Versionen und Prüfsummen fest (für lokal und CI).
lockfile = true

[tools]
# Exakt gepinnt: Der Docker-Build (Dockerfile) und das CI installieren dieselben Versionen über mise.
python = "3.15.2"
uv = "0.13.7"
ruff = "0.17.4"
shellcheck = "0.11.0"

[env]
# mise legt .venv mit dem gepinnten Python an und aktiviert es; uv sync installiert hinein.
_.python.venv = { path = ".venv", create = true }
# uv lädt nie ein eigenes Python herunter – es gilt das aus mise.toml.
UV_PYTHON_DOWNLOADS = "never"
# .env wird NICHT hier geladen – sie enthält den Paprika-Zugang; `mise run serve` liest sie selbst.

[tasks.setup]
description = "Frischer Klon -> lauffähig: Toolchain und Abhängigkeiten installieren"
run = ["mise install", "uv sync --frozen"]

[tasks.lint]
description = "Statische Prüfung: ruff für Python, shellcheck für die Skripte"
run = ["ruff check src tests", "shellcheck scripts/*.sh deploy/lxc/*.sh deploy/proxmox/*.sh"]

[tasks.format]
description = "Code mit ruff formatieren"
run = ["ruff check --fix src tests", "ruff format src tests"]

[tasks.test]
description = "Alle Tests"
run = "uv run --frozen pytest -q"

[tasks.check]
description = "Alles, was vor einem Push grün sein muss (läuft genauso im CI)"
depends = ["lint", "test"]

[tasks.serve]
description = "Web-Oberfläche lokal starten, Paprika-Zugang aus .env falls vorhanden"
run = "if [ -f .env ]; then set -a; . ./.env; set +a; fi; exec uv run --frozen tischlein serve --port ${PORT:-8080}"

[tasks."docker:build"]
description = "Container-Image bauen (Werkzeuge im Image kommen ebenfalls aus mise.toml/mise.lock)"
run = "./scripts/docker-image.sh"

[tasks."docker:publish"]
description = "Release-Image bauen und nach ghcr.io pushen (VERSION=1.2.3, im Release-Workflow)"
env = { IMAGE = "ghcr.io/schowave/tischlein", PUSH = "1" }
run = "./scripts/docker-image.sh"

[tasks."docker:run"]
description = "Gebautes Image lokal starten, Daten in ./data"
run = "docker run --rm -p 8080:8080 -v \"$PWD/data:/data\" --env-file .env tischlein:latest"

[tasks."vendor:alpine"]
description = "Alpine.js für die Rezepte-Seite ablegen (Version und npm-Prüfsumme hier pinnen)"
env = { ALPINE_VERSION = "3.17.5", ALPINE_INTEGRITY = "sha512-XewMqRC6zjy8iaUPn86dxjvooAsNai3hUtQbdn0A5H2w7Jt10xHGZ1SczN5+Dvp3UKkuSEt9moy/UaUWOwKdnQ==" }
run = "./scripts/vendor-alpine.sh"

[tasks."db:revision"]
description = "Neue Alembic-Migration anlegen: mise run db:revision -- -m \"was sich ändert\""
run = "uv run --frozen alembic revision"

[tasks."db:upgrade"]
description = "Lokale Datenbank (data/tischlein.db) auf den neuesten Stand bringen (passiert auch beim Start)"
run = "uv run --frozen alembic upgrade head"
