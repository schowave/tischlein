[project]
name = "tischlein"
version = "0.4.0"
description = "Familien-Essensplan: rotiert bewährte Mittagessen aus Paprika, plant Neu-Slots, liefert ICS-Kalender."
readme = "README.md"
authors = [
    { name = "David Schowalter", email = "schowalter.david@gmail.com" }
]
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
tischlein = "tischlein.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares form fields as Form(...) defaults.
ignore = ["B008"]
